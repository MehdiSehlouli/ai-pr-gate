[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-gate"
version = "0.1.0"
description = "Claude-powered security and code-quality gate for GitHub and Bitbucket pull requests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ai-pr-gate = "gate.__main__:main"

[tool.setuptools]
packages = ["gate"]
